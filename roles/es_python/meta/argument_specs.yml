---
argument_specs:
  main:
    short_description: Install es-python for one user on each host.
    description:
      - Installs es-python the way the install command on the EyalSec Machines page does.
      - With an API key, each host is found by machine name on your account and added on the first run.
      - Does nothing on a host where es-python is already installed for that user, unless es_python_force is true.
    options:
      es_python_api_key:
        type: str
        no_log: true
        default: ""
        description: A full-access EyalSec API key. One key serves every host.
      es_python_install_secret:
        type: str
        no_log: true
        default: ""
        description: A one-time install secret for one machine. Single use, expires 10 minutes after it was issued.
      es_python_authorized:
        type: bool
        default: false
        description: Required with an API key. Your confirmation that you own these hosts or are authorized to monitor them.
      es_python_user:
        type: str
        default: ""
        description: The user es-python is installed for. Empty means the user Ansible connects as.
      es_python_machine:
        type: str
        default: "{{ inventory_hostname }}"
        description: The machine name each host reports under. Must be unique per host.
      es_python_python_version:
        type: str
        default: ""
        choices: ["", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        description: The Python version. Empty matches the host's own python3.
      es_python_url:
        type: str
        default: "https://eyalsec.com"
        description: Your EyalSec address.
      es_python_force:
        type: bool
        default: false
        description: Install again even when es-python is already installed.
      es_python_install_dependencies:
        type: bool
        default: true
        description: Install curl, CA certificates, tar and gzip with the system package manager (needs root).
